<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SimSN Coin Flip sim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #000000;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 1.5rem;
      font-weight: 600;
    }

    #result {
      font-size: 4rem;
      font-weight: 700;
      color: #181f29;
      text-align: center;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <h1>SimSN Coin Flip sim</h1>
  <div id="result"></div>

  <script>
    (function flipCoin() {
      const r = Math.random();
      let resultText;

      if (r < 0.495) {
        resultText = "heads";
      } else if (r < 0.99) {
        resultText = "tails";
      } else {
        resultText = "somehow, incredibly, it landed perfectly on it's side";
      }

      document.getElementById("result").textContent = resultText;
    })();
  </script>
</body>
</html>
